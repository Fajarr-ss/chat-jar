<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WA KW - Mirip WA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{max-width:480px;margin:auto;background:#111b21;color:#e9edef;min-height:100vh;padding-bottom:72px}
#login{height:100vh;background:#0b141a;display:flex;flex-direction:column;justify-content:center;padding:24px}
#login h1{color:#25D366;font-size:34px}
#login p{color:#8696a0;margin:10px 0 20px}
#login input{padding:14px;border-radius:10px;border:none;outline:none;margin-bottom:12px;font-size:16px}
#login button{padding:14px;background:#25D366;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer}
header{display:none;background:#202c33;padding:14px 16px;justify-content:space-between;align-items:center}
header h2{font-size:20px}
header small{color:#25D366}
.topTabs{display:none;background:#202c33;justify-content:space-around;padding:0 10px}
.topTabs div{padding:12px 0;color:#8696a0;font-size:13px;font-weight:bold;cursor:pointer;flex:1;text-align:center}
.topTabs div.active{color:#25D366;border-bottom:3px solid #25D366}
.page{display:none;padding:6px}
.page.active{display:block}
.item{display:flex;gap:12px;padding:12px 8px;border-bottom:1px solid #222d34;cursor:pointer;align-items:center}
.item img{width:52px;height:52px;border-radius:50%;object-fit:cover}
.item b{font-size:15px}
.item small{color:#8696a0;display:block;margin-top:2px;white-space:nowrap;overflow:hidden;max-width:240px;text-overflow:ellipsis}
.jam{margin-left:auto;text-align:right;font-size:11px;color:#8696a0}
.unread{background:#25D366;color:#111;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;margin-top:4px;margin-left:auto}
.status-ring{border:3px solid #25D366;border-radius:50%;padding:2px}
.myStatus{border:3px dashed #8696a0!important}
.fab{position:fixed;bottom:85px;right:calc(50% - 220px);background:#25D366;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;z-index:10}
#chatRoom{display:none;flex-direction:column;height:100vh;background:#0b141a;position:fixed;inset:0;max-width:480px;margin:auto;z-index:20}
.chat-head{background:#202c33;padding:10px;display:flex;gap:10px;align-items:center}
.chat-head img{width:38px;height:38px;border-radius:50%}
.chat-head small{color:#8696a0;font-size:11px}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:78%;padding:8px 10px;border-radius:10px;font-size:14px;position:relative;padding-bottom:16px}
.me{align-self:flex-end;background:#005c4b}
.them{align-self:flex-start;background:#202c33}
.bubble span{position:absolute;right:6px;bottom:2px;font-size:10px;color:#a8b5bb}
.input-bar{display:flex;padding:8px;gap:8px;background:#202c33;align-items:center}
.input-bar input{flex:1;padding:12px;border-radius:20px;border:none;outline:none}
.input-bar button{background:#25D366;border:none;width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:18px}
nav{display:none;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#202c33;justify-content:space-around;padding:10px 0;border-top:1px solid #333}
nav div{text-align:center;cursor:pointer;color:#8696a0;font-size:12px}
nav div.active{color:#25D366}
nav div i{font-size:22px;display:block}
.akun-box{background:#202c33;padding:20px;border-radius:12px;text-align:center}
.akun-box img{width:110px;height:110px;border-radius:50%;object-fit:cover;cursor:pointer}
.akun-box input{width:100%;padding:12px;border-radius:10px;border:none;margin-top:12px;text-align:center;outline:none}
.akun-box button{width:100%;padding:12px;background:#25D366;border:none;border-radius:10px;font-weight:bold;margin-top:10px;cursor:pointer}
#statusView{display:none;position:fixed;inset:0;background:#000;z-index:99;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center}
#statusView img{width:100%;max-width:400px;border-radius:12px;max-height:60vh;object-fit:cover}
#statusView button{margin-top:15px;padding:10px 22px;background:#25D366;border:none;border-radius:10px;font-weight:bold}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;align-items:center;justify-content:center;padding:20px}
.modal .box{background:#222;width:100%;max-width:400px;padding:18px;border-radius:12px}
.modal input,.modal textarea{width:100%;padding:12px;border-radius:10px;border:none;margin:8px 0;outline:none}
.modal button{width:100%;padding:12px;background:#25D366;border:none;border-radius:10px;font-weight:bold;margin-top:8px}
</style>
</head>
<body>

<div id="login">
  <h1>WhatsApp KW</h1>
  <p>Masukin username lu, langsung masuk kaya WA</p>
  <input id="usnInput" placeholder="Username, contoh: airr">
  <button onclick="masuk()">MASUK</button>
</div>

<header id="header"><h2>WhatsApp <span style="color:#25D366">KW</span></h2><small id="myUsnTop">-</small></header>
<div class="topTabs" id="topTabs">
  <div id="tab-chat" class="active" onclick="pindah('chat')">CHAT</div>
  <div id="tab-status" onclick="pindah('status')">STATUS</div>
  <div id="tab-panggilan" onclick="pindah('panggilan')">PANGGILAN</div>
</div>

<div id="page-chat" class="page active"><div id="chatList"></div></div>
<div id="page-status" class="page">
  <div class="item" onclick="bukaModalStatus()"><img id="myFotoMini" src="https://i.pravatar.cc/150" class="myStatus"><div><b>Status saya</b><small>Ketuk untuk tambah status</small></div></div>
  <p style="padding:10px;color:#8696a0;font-size:13px">Pembaruan terkini</p>
  <div id="statusList"></div>
</div>
<div id="page-panggilan" class="page"><div id="callList"></div></div>
<div id="page-akun" class="page">
  <div class="akun-box">
    <label><img id="myFoto" src="https://i.pravatar.cc/200"><input type="file" id="fotoInput" accept="image/*" hidden onchange="gantiFoto(event)"></label>
    <p style="font-size:12px;color:#8696a0;margin-top:6px">Klik foto buat ganti</p>
    <input id="renameInput">
    <input id="bioInput" placeholder="Bio, contoh: lagi sibuk...">
    <button onclick="simpanAkun()">SIMPAN</button>
    <button onclick="logout()" style="background:#ff4444;color:#fff">LOGOUT</button>
  </div>
</div>

<div class="fab" id="fabBtn" onclick="fabAction()">💬</div>

<div id="chatRoom">
  <div class="chat-head"><span onclick="tutupChat()" style="cursor:pointer;font-size:22px">←</span><img id="chatFoto"><div><b id="chatNama"></b><br><small id="typing">online</small></div></div>
  <div class="msgs" id="msgs"></div>
  <div class="input-bar"><input id="chatInput" placeholder="Ketik pesan" oninput="lagiNgetik()"><button onclick="kirimPesan()">➤</button></div>
</div>

<div id="statusView"><h3 id="statusNama"></h3><p id="statusText" style="margin:10px;color:#ccc"></p><img id="statusImg"><button onclick="tutupStatus()">TUTUP</button></div>

<div class="modal" id="modalStatus"><div class="box"><h3>Buat Status Baru</h3><input id="statusCaption" placeholder="Caption status..."><input type="file" id="statusFile" accept="image/*"><button onclick="simpanStatus()">POST STATUS</button><button onclick="tutupModal()" style="background:#444;color:#fff">BATAL</button></div></div>

<nav id="bottomNav">
  <div id="nav-chat" class="active" onclick="pindahBawah('chat')">💬<br>Chat</div>
  <div id="nav-status" onclick="pindahBawah('status')">⭕<br>Status</div>
  <div id="nav-panggilan" onclick="pindahBawah('panggilan')">📞<br>Panggilan</div>
  <div id="nav-akun" onclick="pindahBawah('akun')">👤<br>Akun</div>
</nav>

<script>
let users=[
 {usn:"budi",foto:"https://i.pravatar.cc/150?img=12",last:"wkwk kapan mabar?",jam:"19.20",unread:2,status:"Lagi di Jogja 🌴",statusImg:"https://picsum.photos/400/500?random=1"},
 {usn:"sinta",foto:"https://i.pravatar.cc/150?img=32",last:"udah makan?",jam:"18.45",unread:0,status:"Healing dulu",statusImg:"https://picsum.photos/400/500?random=2"},
 {usn:"joko",foto:"https://i.pravatar.cc/150?img=56",last:"gas ranked!",jam:"17.10",unread:1,status:"Push rank",statusImg:"https://picsum.photos/400/500?random=3"},
];
let myUsn=localStorage.getItem("usn")||"";
let myFoto=localStorage.getItem("foto")||"https://i.pravatar.cc/200";
let myBio=localStorage.getItem("bio")||"Halo, saya pake WA KW";
let myStatusList=JSON.parse(localStorage.getItem("myStatus")||"[]");
let chats=JSON.parse(localStorage.getItem("chats")||"{}");
let chatAktif=null;
let tabAktif="chat";

if(myUsn) tampilkanApp();
function masuk(){let v=document.getElementById("usnInput").value.trim();if(!v)return alert("Isi username dulu!");myUsn=v;localStorage.setItem("usn",v);tampilkanApp();}
function tampilkanApp(){document.getElementById("login").style.display="none";document.getElementById("header").style.display="flex";document.getElementById("topTabs").style.display="flex";document.getElementById("bottomNav").style.display="flex";document.getElementById("page-chat").classList.add("active");updateProfil();renderAll();}
function updateProfil(){document.getElementById("myUsnTop").innerText="@"+myUsn;document.getElementById("myFoto").src=myFoto;document.getElementById("myFotoMini").src=myFoto;document.getElementById("renameInput").value=myUsn;document.getElementById("bioInput").value=myBio;}
function simpanAkun(){myUsn=document.getElementById("renameInput").value.trim()||myUsn;myBio=document.getElementById("bioInput").value;localStorage.setItem("usn",myUsn);localStorage.setItem("bio",myBio);updateProfil();alert("Tersimpan!");}
function gantiFoto(e){let r=new FileReader();r.onload=()=>{myFoto=r.result;localStorage.setItem("foto",myFoto);updateProfil();};r.readAsDataURL(e.target.files[0]);}
function logout(){localStorage.removeItem("usn");location.reload();}
function pindah(tab){tabAktif=tab;document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));document.querySelectorAll(".topTabs div").forEach(t=>t.classList.remove("active"));if(tab=="akun"){document.getElementById("page-akun").classList.add("active");}else{document.getElementById("page-"+tab).classList.add("active");document.getElementById("tab-"+tab).classList.add("active");}renderAll();}
function pindahBawah(tab){document.querySelectorAll("nav div").forEach(n=>n.classList.remove("active"));document.getElementById("nav-"+tab).classList.add("active");if(tab=="akun"){document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));document.getElementById("page-akun").classList.add("active");document.getElementById("fabBtn").innerText="👤";}else{pindah(tab);document.getElementById("fabBtn").innerText=tab=="chat"?"💬":tab=="status"?"⭕":"📞";}}
function fabAction(){if(tabAktif=="status"||document.getElementById("page-status").classList.contains("active")) bukaModalStatus(); else alert("Chat baru: pilih orang di list chat!");}
function renderAll(){renderChatList();renderStatus();renderCall();}
function renderChatList(){document.getElementById("chatList").innerHTML=users.map(u=>{let lastMsg=chats[u.usn]?.slice(-1)[0]?.text||u.last;return `<div class="item" onclick="bukaChat('${u.usn}')"><img src="${u.foto}"><div><b>${u.usn}</b><small>${lastMsg}</small></div><div class="jam">${u.jam}${u.unread?`<div class="unread">${u.unread}</div>`:""}</div></div>`}).join("");}
function renderStatus(){document.getElementById("statusList").innerHTML=users.map(u=>`<div class="item" onclick="bukaStatus('${u.usn}')"><div class="status-ring"><img src="${u.foto}"></div><div><b>${u.usn}</b><small>${u.status}</small></div></div>`).join("") + myStatusList.map((s,i)=>`<div class="item" onclick="lihatStatusSaya(${i})"><div class="status-ring"><img src="${myFoto}"></div><div><b>Status saya</b><small>${s.caption}</small></div></div>`).join("");}
function renderCall(){document.getElementById("callList").innerHTML=users.map(u=>`<div class="item"><img src="${u.foto}"><div><b>${u.usn}</b><small>📞 Panggilan suara • Kemarin</small></div><span style="margin-left:auto">📞</span></div>`).join("");}
function bukaChat(usn){chatAktif=usn;let u=users.find(x=>x.usn==usn);u.unread=0;document.getElementById("chatNama").innerText=u.usn;document.getElementById("chatFoto").src=u.foto;document.getElementById("chatRoom").style.display="flex";renderPesan();renderChatList();}
function tutupChat(){document.getElementById("chatRoom").style.display="none";}
function renderPesan(){let list=chats[chatAktif]||[];document.getElementById("msgs").innerHTML=list.map(m=>`<div class="bubble ${m.dari==myUsn?'me':'them'}">${m.text}<span>${m.jam} ${m.dari==myUsn?'✓✓':''}</span></div>`).join("");let el=document.getElementById("msgs");el.scrollTop=99999;}
function kirimPesan(){let inp=document.getElementById("chatInput");let txt=inp.value.trim();if(!txt)return;if(!chats[chatAktif])chats[chatAktif]=[];let jam=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});chats[chatAktif].push({dari:myUsn,text:txt,jam});localStorage.setItem("chats",JSON.stringify(chats));inp.value="";renderPesan();document.getElementById("typing").innerText="mengetik...";setTimeout(()=>{chats[chatAktif].push({dari:chatAktif,text:"Oke bro, paham 👍",jam});localStorage.setItem("chats",JSON.stringify(chats));document.getElementById("typing").innerText="online";renderPesan();renderChatList();},1200);}
function lagiNgetik(){document.getElementById("typing").innerText="mengetik...";}
function bukaStatus(usn){let u=users.find(x=>x.usn==usn);document.getElementById("statusNama").innerText=u.usn;document.getElementById("statusText").innerText=u.status;document.getElementById("statusImg").src=u.statusImg;document.getElementById("statusView").style.display="flex";}
function lihatStatusSaya(i){let s=myStatusList[i];document.getElementById("statusNama").innerText="Status saya";document.getElementById("statusText").innerText=s.caption;document.getElementById("statusImg").src=s.img||myFoto;document.getElementById("statusView").style.display="flex";}
function tutupStatus(){document.getElementById("statusView").style.display="none";}
function bukaModalStatus(){document.getElementById("modalStatus").style.display="flex";}
function tutupModal(){document.getElementById("modalStatus").style.display="none";}
function simpanStatus(){let cap=document.getElementById("statusCaption").value||"Status baru";let file=document.getElementById("statusFile").files[0];if(file){let r=new FileReader();r.onload=()=>{myStatusList.push({caption:cap,img:r.result});localStorage.setItem("myStatus",JSON.stringify(myStatusList));tutupModal();renderStatus();alert("Status dipost!");};r.readAsDataURL(file);}else{myStatusList.push({caption:cap,img:myFoto});localStorage.setItem("myStatus",JSON.stringify(myStatusList));tutupModal();renderStatus();}}
</script>
</body>
    </html>
